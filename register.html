<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | E-Commerce Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <a href="index.html">
                <img src="images/logo.png" alt="E-Commerce Logo">
            </a>
        </div>

        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact Us</a>
        </nav>

        <div class="nav-icons">

            <a href="login.html" title="Login">
                <img src="images/login logo.png" alt="Login">
            </a>

            <a href="cart.html" title="Shopping Cart">
                <img src="images/cart.png" alt="Shopping Cart">
                <span class="cart-count">0</span>
            </a>

            <a href="#" title="Notifications">
                <img src="images/bell.png" alt="Notifications">
            </a>

            <button class="menu-btn" title="Menu">
                <img src="images/hrztl.png" alt="Menu">
            </button>

        </div>

    </header>


    <!-- REGISTER -->
    <main class="register-page">

        <div class="register-container">

            <!-- FORM -->
            <section class="register-form">

                <h1>Create Account</h1>

                <p class="register-subtitle">
                    Register to start shopping with us.
                </p>

                <form>

                    <div class="form-group">
                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="contact">Contact Number</label>

                        <input
                            type="tel"
                            id="contact"
                            placeholder="Enter contact number"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm password"
                            required
                        >
                    </div>


                    <button
                        type="submit"
                        class="register-btn"
                    >
                        Create Account
                    </button>

                </form>


                <p class="login-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </section>


            <!-- IMAGE -->
            <div class="register-image">

                <img
                    src="images/register.png"
                    alt="Register"
                >

            </div>

        </div>

    </main>

</body>

</html>
