<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | E-Commerce Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <a href="index.html">
                <img src="images/logo.png" alt="E-Commerce Logo">
            </a>
        </div>

        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact Us</a>
        </nav>

        <div class="nav-icons">

            <a href="login.html" title="Login">
                <img src="images/login logo.png" alt="Login">
            </a>

            <a href="cart.html" title="Shopping Cart">
                <img src="images/cart.png" alt="Shopping Cart">
                <span class="cart-count">0</span>
            </a>

            <a href="#" title="Notifications">
                <img src="images/bell.png" alt="Notifications">
            </a>

            <button class="menu-btn" title="Menu">
                <img src="images/hrztl.png" alt="Menu">
            </button>

        </div>

    </header>


    <!-- LOGIN -->
    <main class="login-page">

        <div class="login-container">

            <!-- LOGIN FORM -->
            <section class="login-form">

                <h1>Member Login</h1>

                <p class="login-subtitle">
                    Login to continue shopping with us.
                </p>

                <form>

                    <div class="form-group">
                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >
                    </div>


                    <div class="login-options">
                        <a href="#">Forgot Password?</a>
                    </div>


                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Login
                    </button>

                </form>


                <p class="signup-text">
                    Don't have an account?
                    <a href="register.html">Sign Up</a>
                </p>

            </section>


            <!-- LOGIN IMAGE -->
            <div class="login-image">

                <img
                    src="images/login-button-click-app-icon-vector-28806677.jpg"
                    alt="Login"
                >

            </div>

        </div>

    </main>

</body>

</html>
